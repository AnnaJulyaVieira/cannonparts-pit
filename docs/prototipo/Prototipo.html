<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CannonParts — Protótipo</title>
<style>
:root{--bg:#F5F6F8;--card:#fff;--ink:#1F2430;--mut:#6B7280;--line:#E5E7EB;--brand:#B3261E;--brand2:#7B1E1E;--ok:#15803D;--okbg:#DCFCE7;--bad:#B91C1C;--badbg:#FEE2E2;--warn:#B45309;--warnbg:#FEF3C7;--info:#1D4ED8;--infobg:#DBEAFE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh;width:1440px}
.side{width:236px;background:#1F2430;color:#E5E7EB;padding:20px 14px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:0 6px 26px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:inline-block}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#C9CED8;text-decoration:none;font-size:13.5px;margin-bottom:2px}
.nav a.on{background:#2E3442;color:#fff;font-weight:600}
.nav a b{width:8px;height:8px;border-radius:2px;background:#4B5263;display:inline-block}
.nav a.on b{background:var(--brand)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#7C8394;margin:16px 10px 6px}
.main{flex:1;padding:22px 28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top h1{font-size:22px}.top .sub{color:var(--mut);font-size:13px;margin-top:2px}
.user{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.av{width:34px;height:34px;border-radius:50%;background:#E8D5D3;color:var(--brand2);display:flex;align-items:center;justify-content:center;font-weight:700}
.row{display:flex;gap:14px;margin-bottom:14px}.col{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .l{color:var(--mut);font-size:12.5px}.kpi .v{font-size:24px;font-weight:800;margin:6px 0 2px}.kpi .d{font-size:12px;color:var(--ok)}
.kpi.hl{border:2px solid var(--brand);background:#FFF8F7}.kpi.hl .v{color:var(--brand2)}
h3{font-size:15px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-align:left;color:var(--mut);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:#FAFAFB}
td{padding:10px;border-bottom:1px solid var(--line);font-size:13.5px}
.num{text-align:right}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}.info{background:var(--infobg);color:var(--info)}.neu{background:#EEF0F3;color:#4B5263}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.inp{border:1px solid #D1D5DB;border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--mut);background:#fff;min-width:200px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.sp{flex:1}
.chart{height:210px;display:flex;align-items:flex-end;gap:14px;padding:10px 6px 0;border-bottom:1px solid var(--line)}
.chart div{flex:1;border-radius:6px 6px 0 0;position:relative}
.chart span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.alert{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.alert.bad{border:1px solid #FECACA}.alert.ok{border:1px solid #BBF7D0}.alert.info{border:1px solid #BFDBFE}
.muted{color:var(--mut)}.b{font-weight:700}
.login{width:1440px;height:900px;display:flex}
.login .l{flex:1;background:linear-gradient(135deg,#7B1E1E,#B3261E);color:#fff;padding:70px;display:flex;flex-direction:column;justify-content:center}
.login .l h2{font-size:36px;margin:18px 0 12px;max-width:520px}.login .l p{max-width:470px;opacity:.9;font-size:16px;line-height:1.5}
.login .r{width:560px;display:flex;align-items:center;justify-content:center;background:#fff}
.form{width:380px}.form h1{font-size:24px;margin-bottom:6px}.form label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
.form .inp{width:100%}.form .btn{width:100%;justify-content:center;margin-top:22px;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acc{display:flex;gap:12px;align-items:center}.acc .ic{width:44px;height:44px;border-radius:10px;background:#FFE600;display:flex;align-items:center;justify-content:center;font-weight:800;color:#2D3277}
.field{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.field .inp{min-width:120px;width:140px;text-align:right;color:var(--ink)}
.drop{border:2px dashed #D1D5DB;border-radius:12px;padding:22px;text-align:center;color:var(--mut)}
.steps{display:flex;gap:8px;margin-bottom:14px}.steps div{flex:1;padding:10px;border-radius:8px;background:#EEF0F3;font-size:12.5px;color:var(--mut)}.steps div.on{background:#FFF1F0;color:var(--brand2);font-weight:700}
.modal{position:absolute;right:40px;top:170px;width:380px;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.18);border:1px solid var(--line);padding:18px}
.rel{position:relative}
/* ===== modo wireframe (baixa fidelidade) ===== */
body.wire{--bg:#fff;--card:#fff;--ink:#333;--mut:#777;--line:#BDBDBD;--brand:#888;--brand2:#555;--ok:#555;--okbg:#E5E5E5;--bad:#555;--badbg:#D4D4D4;--warn:#555;--warnbg:#EDEDED;--info:#555;--infobg:#E5E5E5;font-family:"Comic Sans MS","Segoe Print",Arial,sans-serif}
body.wire .side{background:#EDEDED;color:#333;border-right:2px solid #999}.body.wire .nav a{color:#444}
body.wire .nav a{color:#444}body.wire .nav a.on{background:#D4D4D4;color:#222}
body.wire .logo i{background:#999}
body.wire .card{border:2px solid #999;border-radius:6px}
body.wire .chart div{background:repeating-linear-gradient(45deg,#ddd,#ddd 6px,#f3f3f3 6px,#f3f3f3 12px)!important;border:1px solid #999}
body.wire .login .l{background:#E0E0E0;color:#333}
body.wire .acc .ic{background:#ccc;color:#333}
body.wire .kpi.hl{background:#F2F2F2;border:2px dashed #555}
body.wire .btn.p{background:#666;border-color:#666}
body.wire .av{background:#ddd;color:#333}
body.wire td,body.wire th{font-size:13px}
</style></head>
<body>
<div id="root"></div>
<script>
const NAV=[['02','Dashboard'],['03','Preço mínimo'],['04','Estoque e sincronização'],['05','Promoções'],['06','Rentabilidade da publicidade'],['12','Carga de anúncios'],['10','Anúncios sem SKU'],['07','Log de auditoria'],['08','Contas do Mercado Livre'],['09','Usuários e perfis'],['11','Configurações']];
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function shell(id,title,sub,body,user='Marcos Andrade · Dono'){
  const perm=user.includes('Dono')?null:user.includes('Operador')?['04','10']:['02','03','04','05','06','12','10','07'];
  const nav=NAV.filter(([k])=>!perm||perm.includes(k)).map(([k,l])=>[k,l,NAV.findIndex(n=>n[0]==k)]).map(([k,l,i])=>(i==6?'<div class="sec">Controle</div>':'')+(i==8?'<div class="sec">Administração</div>':'')+`<a class="${k==id?'on':''}"><b></b>${l}</a>`).join('');
  return `<div class="app"><aside class="side"><div class="logo"><i></i>CannonParts</div><nav class="nav"><div class="sec">Operação</div>${nav}</nav></aside>
  <main class="main"><div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="user"><span class="inp" style="min-width:150px">Todas as contas ▾</span><span>${user}</span><div class="av">${user[0]}</div></div></div>${body}</main></div>`;
}
const S={};
S['01']=()=>`<div class="login"><div class="l"><div class="logo" style="margin:0"><i style="background:#fff"></i>CannonParts</div><h2>Nenhuma decisão automática abaixo do preço mínimo.</h2><p>Promoções, estoque, publicidade e cadastro em lote de todas as suas contas do Mercado Livre, protegidos pela mesma regra de lucro.</p></div>
<div class="r"><div class="form"><h1>Entrar no painel</h1><div class="muted">Use o e-mail cadastrado pelo dono da loja.</div><label>E-mail</label><div class="inp">camila@cannonparts.com.br</div><label>Senha</label><div class="inp">••••••••••</div><div class="btn p">Entrar</div><div class="muted" style="margin-top:14px;font-size:12.5px">Recebeu um convite? Use o link do e-mail para criar sua senha.</div></div></div></div>`;
S['02']=()=>shell('02','Dashboard de vendas','Todas as contas · últimos 30 dias',`
<div class="row">
